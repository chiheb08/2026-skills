# Redis Enterprise — NetworkPolicy: allow traffic between redis-enterprise pods and app pods (podSelector only)
# Apps: redis-enterprise, vllm, litellm-db (selected by pod labels).
# Apply in the same namespace as your REC (e.g. redis-enterprise or your OpenShift project name).
# Replace "redis-enterprise" in metadata.namespace below with your actual namespace if different.
# Prerequisite: CNI must support NetworkPolicy (Calico, OVN-Kubernetes, Cilium, etc.).
#
# Note: podSelector only matches pods in the policy's namespace. Ensure redis-enterprise, vllm, and
# litellm-db pods that should talk to each other share a namespace, or apply this policy in each
# namespace and use the same label conventions.
#
# Label conventions used below (adjust matchLabels to your pod labels):
#   - redis-enterprise REC pods: app=redis-enterprise, redis.io/cluster=rec, redis.io/role=node
#   - rec-services-rigger: app=redis-enterprise, name=services-rigger, redis.io/cluster=rec
#   - vllm:             app.kubernetes.io/name: vllm (adjust if different)
#   - litellm-db:       app.kubernetes.io/name: litellm-db (adjust if different)
#
# Apply:
#   kubectl apply -f redis-enterprise-network-policy.yaml -n redis-enterprise
#
# If rec-services-rigger or redis-enterprise-operator log "get https://rec:9443/... context deadline
# exceeded", see 10-redis-enterprise-rec-services-rigger-9443-timeout-deep-dive.md and ensure
# policies allow traffic from operator and services-rigger (rules below) and Service rec has endpoints.
#
# Ingress: Redis Enterprise pods accept traffic from redis-enterprise-operator, rec-services-rigger,
# redis-enterprise, vllm, litellm-db. Port 9443 (REC REST API) is explicitly allowed.
# Egress:  Redis Enterprise pods can reach redis-enterprise (internode communication on ports 3333-3345,
# 20000-29999), vllm, litellm-db, plus external. Internode communication is required for rec-1, rec-2
# to bootstrap and join the cluster.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-enterprise-allow
  namespace: redis-enterprise
spec:
  # Pods with label "redis-enterprise" (REC cluster nodes and components)
  # Your pods use: app=redis-enterprise (not app.kubernetes.io/name)
  podSelector:
    matchLabels:
      app: redis-enterprise
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From redis-enterprise pods (same app) - your pods use app=redis-enterprise
    - from:
        - podSelector:
            matchLabels:
              app: redis-enterprise
    # From redis-enterprise-operator (if it exists and needs rec:9443/v1/nodes)
    # Note: podSelector: {} below already allows all pods in namespace, so operator is included
    # If operator has different labels, add a rule here matching those labels
    # - from:
    #     - podSelector:
    #         matchLabels:
    #           <operator-pod-labels>
    # From rec-services-rigger - your pod has app=redis-enterprise, name=services-rigger
    - from:
        - podSelector:
            matchLabels:
              app: redis-enterprise
              name: services-rigger
    - from:
        - podSelector:
            matchLabels:
              app: redis-enterprise
              redis.io/cluster: rec
    # Explicit: allow ingress to REC pods on port 9443 (REST API) from any pod in same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9443
    # From vllm pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vllm
    # From litellm-db pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-db
  egress:
    # To redis-enterprise pods (internode communication) - your pods use app=redis-enterprise
    # This allows rec-0, rec-1, rec-2 to communicate with each other for cluster formation
    - to:
        - podSelector:
            matchLabels:
              app: redis-enterprise
              redis.io/cluster: rec
      ports:
        # Internode communication ports (required for rec-1, rec-2 to bootstrap and join cluster)
        - protocol: TCP
          port: 3333-3345
        - protocol: TCP
          port: 20000-29999
        # REST API port (9443) for cluster management
        - protocol: TCP
          port: 9443
        # Other REC ports (8443 UI, 8001 discovery, etc.)
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8001
    # To redis-enterprise pods (all ports, fallback for other communication)
    - to:
        - podSelector:
            matchLabels:
              app: redis-enterprise
    # To vllm pods
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vllm
    # To litellm-db pods
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-db
    # Egress to external (DNS, call-home, image pull, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
---
# Policy for REC cluster pods (rec-0, rec-1, ...) — selected by service "rec".
# Service "rec" typically uses selectors: app=redis-enterprise, redis.io/cluster=rec, redis.io/role=node.
# This policy selects the same pods (app=redis-enterprise, redis.io/cluster=rec) so operator and
# rec-services can reach rec:9443. If your service uses different selectors, adjust matchLabels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rec-allow-9443
  namespace: redis-enterprise
spec:
  podSelector:
    matchLabels:
      app: redis-enterprise
      redis.io/cluster: rec
  policyTypes:
    - Ingress
  ingress:
    # Note: podSelector: {} below already allows all pods in namespace (including operator)
    # If operator is in a different namespace, uncomment the optional policy at the bottom
    # Allow port 9443 from any pod in same namespace (rec-services-rigger, etc.)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9443
    # Allow all ports from same namespace (cluster internode, services-rigger, operator, etc.)
    - from:
        - podSelector: {}
---
# Optional: use ONLY if redis-enterprise-operator runs in a DIFFERENT namespace (e.g. operators).
# podSelector: {} in rec-allow-9443 only matches pods in redis-enterprise; it does not allow
# the operator in another namespace. Uncomment, set the namespace label, and apply.
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: rec-allow-from-operator-namespace
#   namespace: redis-enterprise
# spec:
#   podSelector:
#     matchLabels:
#       app: rec
#   policyTypes:
#     - Ingress
#   ingress:
#     - from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: operators   # or your operator namespace name
#       ports:
#         - protocol: TCP
#           port: 9443
