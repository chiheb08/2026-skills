# Redis Enterprise — NetworkPolicy: allow traffic between redis-enterprise pods and all app namespaces
# App namespaces: redis-enterprise, vllm, litellm-db
# Apply in the same namespace as your REC (redis-enterprise).
# Prerequisite: CNI must support NetworkPolicy (Calico, OVN-Kubernetes, Cilium, etc.).
#
# Pod selector: pods with label app.kubernetes.io/name: redis-enterprise.
# If your REC pods use a different label (e.g. redis-enterprise: "true"), change matchLabels below.
#
# Apply:
#   kubectl apply -f redis-enterprise-network-policy.yaml -n redis-enterprise
#
# OpenShift: If DNS is in openshift-dns, change the egress DNS rule to use
#   matchLabels: kubernetes.io/metadata.name: openshift-dns
#
# Ingress: Redis Enterprise pods accept traffic from any pod in redis-enterprise, vllm, litellm-db.
# Egress:  Redis Enterprise pods can reach any pod in redis-enterprise, vllm, litellm-db, plus DNS and external.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-enterprise-allow
  namespace: redis-enterprise
spec:
  # Pods with label "redis-enterprise" (e.g. app.kubernetes.io/name: redis-enterprise)
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-enterprise
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From redis-enterprise namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-enterprise
    # From vllm namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vllm
    # From litellm-db namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm-db
  egress:
    # To redis-enterprise namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-enterprise
    # To vllm namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vllm
    # To litellm-db namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm-db
    # DNS (UDP and TCP)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Egress to external (call-home, image pull, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
